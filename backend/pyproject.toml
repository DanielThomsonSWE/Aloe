[project]
name = "aloe-api"
version = "0.1.0"
description = "Aloe single-screen medication MVP API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "pydantic-settings>=2.7"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
